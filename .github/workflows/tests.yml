name: tests

# Every push, on every branch, and every pull request.
#
# Not just main, deliberately: main is what GitHub Pages serves, so by the time
# a failure shows up there it has already gone out to whatever phones have the
# app installed. Running on branches is what makes it possible to see a change
# is green *before* it becomes the thing referees are using.
#
# Pages is built by the `pages` workflow. For the development branch, the
# last job here asks for that build once the tests are green, which is what
# puts the test build at /VRL/next/ — a red branch never reaches the phones.
# The live app still goes out as main is pushed. See
# .claude/skills/deploy/SKILL.md.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser the end-to-end tests drive. `--with-deps` adds the system
      # libraries a headless Chromium needs on a bare runner.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The https certificate for localhost is generated on first use
      # (tools/certs.js), so there is nothing to set up here.
      # app/ is compiled from src/ and committed, because GitHub Pages serves
      # the branch as it is and `git push` is the deploy. That only stays
      # honest if the committed output matches the sources, so check it: a
      # rebuild must change nothing. The emit is byte-reproducible, so a diff
      # here means someone edited src/ and forgot `npm run build`.
      - name: The committed build matches the sources
        run: |
          npm run build
          git diff --exit-code -- app/ \
            || { echo "::error::app/ is stale — run 'npm run build' and commit the result"; exit 1; }

      - run: npm test

  # The test build at /VRL/next/, from the development branch, once its tests
  # pass: a run of the `pages` workflow on main, naming this branch. (A run
  # asked for with this workflow's own token is one of the few kinds GitHub
  # lets a workflow start.) Which branch counts as the development branch is
  # the repository variable NEXT_BRANCH, or else the default named here and in
  # pages.yml.
  next:
    needs: test
    if: github.event_name == 'push' && github.ref_name == (vars.NEXT_BRANCH || 'claude/vrl-characterization-suite')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ask for the test build to be deployed
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f next="$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
