<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the preview reaches the edges on a notched phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SBA Replay" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons for the home screen and uses this one. -->
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" href="icon-192.png" />
    <title>SBA Referee Aid</title>
    <style>
      :root {
        --ground: #0b0f12;
        --panel: #151b20;
        --ink: #e8edf0;
        --faded: #8a969e;
        --rule: #2a343b;
        --accent: #37c8d8;
        --mark: #e05252;
        --warm: #e0a020;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        /* dvh, or the iOS toolbars steal the bottom of the screen. */
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      /* Three modes. Idle and recording share the camera, so they share a
         section and differ only in what is offered underneath it. */
      section { display: none; flex: 1; min-height: 0; flex-direction: column; }
      body[data-screen="idle"] #live,
      body[data-screen="recording"] #live,
      body[data-screen="review"] #review { display: flex; }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        /*
          Every touch belongs to the layer above: marking while filming,
          dragging through the footage while reviewing. Letting the video element
          see them is what made iOS draw its own play glyph over the picture —
          so it does not see them, and there is no glyph to hide afterwards.
        */
        pointer-events: none;
      }

      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 12px 16px;
        cursor: pointer;
        /* A tap on a phone must not also be a double-tap zoom or a text select. */
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      button:disabled { opacity: 0.35; }
      button:active:not(:disabled) { filter: brightness(1.25); }

      .stage { position: relative; flex: 1; min-height: 0; }

      /* ---------- idle and recording ---------- */

      .hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        font-size: 14px;
        background: linear-gradient(rgba(0, 0, 0, 0.55), transparent);
        /* This sits over whatever the camera is pointed at, which may be pale. */
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      }
      .hud .grow { flex: 1; }
      #elapsed { font-variant-numeric: tabular-nums; font-family: ui-monospace, Menlo, monospace; }
      body[data-screen="idle"] #elapsed, body[data-screen="idle"] #recording-dot { display: none; }
      #recording-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--mark);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.25; } }

      #dots { display: flex; gap: 6px; }
      #dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 1px solid var(--faded);
        display: block;
      }
      #dots i.on { background: var(--mark); border-color: var(--mark); }

      .icon {
        padding: 4px 9px;
        font-size: 15px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.4);
      }
      /* So "am I running the one you just fixed?" is answerable without asking. */
      .ver { font-size: 11px; color: var(--faded); font-family: ui-monospace, Menlo, monospace; }
      /* Only in idle. While filming the whole picture is the mark button, and
         anything sitting on top of it is somewhere a mark can be lost. */
      body[data-screen="recording"] #info,
      body[data-screen="recording"] .ver { display: none; }

      /*
        While recording, the whole picture is the BOOKMARK button. It is the
        biggest target a phone can offer and it needs no looking at — which is
        the point, because the referee is watching the fight, not the screen.
      */
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      #flash.on { animation: flash 200ms ease-out; }
      @keyframes flash { 0% { opacity: 0.5; } 100% { opacity: 0; } }

      .tapHint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 10px;
        margin: 0;
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        pointer-events: none;
      }
      body[data-screen="idle"] .tapHint { display: none; }

      .actions { display: flex; gap: 10px; padding: 12px; flex: none; }
      #start { flex: 1; font-size: 26px; font-weight: 700; letter-spacing: 0.04em; padding: 26px 16px; background: var(--accent); color: #06232a; border-color: var(--accent); }
      #toReview, #end { flex: 1; font-size: 17px; padding: 16px 0; }
      #toReview { border-color: var(--accent); color: var(--accent); }
      body[data-screen="idle"] #toReview,
      body[data-screen="idle"] #end,
      body[data-screen="recording"] #start { display: none; }

      /* ---------- review ---------- */

      #topbar { display: flex; gap: 8px; padding: 10px 12px 0; flex: none; align-items: stretch; }
      #tabs { display: flex; gap: 8px; flex: 1; min-width: 0; }
      #tabs button { flex: 1; font-size: 20px; font-weight: 700; padding: 12px 0; }
      #tabs button.on { border-color: var(--accent); color: var(--accent); }
      #toRecord { font-size: 13px; padding: 12px 10px; flex: none; border-color: var(--mark); color: var(--mark); }

      /* Over the footage rather than beside it: it costs no room there. */
      #readout {
        position: absolute;
        top: 8px;
        right: 10px;
        font-family: ui-monospace, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        padding: 3px 7px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: var(--ink);
      }

      /* Where in the window the footage is, without spending a row on saying so. */
      #progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, 0.14); }
      #progress i { display: block; height: 100%; width: 0; background: var(--accent); }

      #shortfall {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 3px;
        padding: 7px 12px;
        font-size: 13px;
        color: var(--warm);
        background: rgba(0, 0, 0, 0.6);
        text-align: center;
      }
      #shortfall:empty { display: none; }

      /*
        No slider: the picture is the slider. A thumb dragged across it spans the
        whole window, which is a target the size of the screen instead of one
        six millimetres tall — and it works without looking down at your hand.
      */
      #review .stage {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .dragHint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        margin: 0;
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
        pointer-events: none;
      }

      .foot { display: flex; gap: 10px; padding: 12px; flex: none; justify-content: flex-end; }

      /* ---------- asking before throwing something away ---------- */

      #confirm {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.72);
        z-index: 20;
      }
      #confirm[hidden] { display: none; }
      #confirm .box {
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 22px;
        max-width: 360px;
      }
      #confirm h3 { margin: 0 0 10px; font-size: 18px; }
      #confirm p { margin: 0 0 18px; font-size: 14.5px; color: var(--faded); }
      #confirm .row { display: flex; gap: 10px; }
      #confirm .row button { flex: 1; }
      #confirm .danger { background: var(--mark); border-color: var(--mark); color: #fff; }

      /* ---------- the panel behind the ⓘ ---------- */

      #diag {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
        background: #06090b;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.6;
        z-index: 10;
      }
      #diag[hidden] { display: none; }
      #diag-body { white-space: pre-wrap; word-break: break-word; }
      #diag h2 { font-size: 13px; margin: 18px 0 4px; color: var(--accent); }
      #diag .close { position: sticky; top: 0; float: right; }
      #diag .headline { color: var(--warm); }

      /* Set once, not while looking — so they live here rather than on the screen. */
      .tune { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--faded); }
      .tune label { display: flex; align-items: center; gap: 10px; }
      .tune input[type="range"] { flex: 1; min-width: 0; accent-color: var(--faded); }
      #lead-value, #tail-value { flex: none; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

      /* Only ever has something to say before filming starts, or when something
         has gone wrong — and both of those happen in idle. */
      .note { padding: 12px; color: var(--faded); font-size: 13.5px; text-align: center; }
      body[data-screen="recording"] #live-note { display: none; }

      /* ---------- held sideways ----------

         A fight moves across, not up, so the phone will be held landscape — and
         a phone on its side has about 400px of height, which stacked controls
         would eat entirely. Filming puts its two buttons down the right; review
         has no controls left to move, so the picture simply takes everything
         under the marks. */
      @media (orientation: landscape) and (max-height: 600px) {
        #live { flex-direction: row; }
        #live-note { display: none; }
        .actions { flex-direction: column; width: 170px; justify-content: center; }
        #start { font-size: 21px; padding: 20px 8px; }
        #tabs button { padding: 8px 0; }
      }
    </style>
  </head>
  <body data-screen="idle">
    <!-- ---------------- idle and recording ---------------- -->
    <section id="live">
      <div class="stage" id="camera">
        <video id="preview" playsinline muted autoplay></video>
        <div id="flash"></div>
        <div class="hud">
          <span id="recording-dot"></span>
          <span id="elapsed">0:00</span>
          <span id="dots"></span>
          <span class="grow"></span>
          <span class="ver" id="version"></span>
          <button class="icon" id="share" title="Put this on somebody else's phone">&#8599;</button>
          <button class="icon" id="info" title="What this device can do">&#9432;</button>
        </div>
        <p class="tapHint" id="tapHint">tap anywhere to mark</p>
      </div>
      <p class="note" id="live-note">Point it at the fight, then press START.</p>
      <div class="actions">
        <button id="start">START</button>
        <button id="toReview" disabled>REVIEW</button>
        <button id="end">END</button>
      </div>
    </section>

    <!-- ---------------- review ---------------- -->
    <section id="review">
      <nav id="topbar">
        <div id="tabs"></div>
        <button id="toRecord">RECORD</button>
      </nav>

      <div class="stage" id="stage">
        <video id="clip" playsinline></video>
        <span id="readout">+0.00s</span>
        <p class="dragHint">drag anywhere to move through it</p>
        <div id="shortfall"></div>
        <div id="progress"><i></i></div>
      </div>
    </section>

    <!-- ---------------- throwing a bout away ---------------- -->
    <div id="confirm" hidden>
      <div class="box">
        <h3 id="confirm-title">Discard this bout?</h3>
        <p id="confirm-text"></p>
        <div class="row">
          <button id="confirm-cancel">Keep filming</button>
          <button class="danger" id="confirm-end">Discard</button>
        </div>
      </div>
    </div>

    <div id="diag" hidden>
      <button class="close" id="diag-close">Close</button>
      <h2>how much to show either side of a mark</h2>
      <div class="tune">
        <label>before <input id="lead" type="range" min="500" max="4000" step="100" /><span id="lead-value"></span></label>
        <label>after <input id="tail" type="range" min="200" max="3000" step="100" /><span id="tail-value"></span></label>
      </div>
      <div id="diag-body"></div>
    </div>

    <script type="module" src="solo.js"></script>
  </body>
</html>
